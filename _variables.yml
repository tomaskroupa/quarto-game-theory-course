# Keep all reusable normal-form games in this one file.
# Insert a matrix with, for example:
# {{< var games.prisoners_dilemma.matrix >}}

games:
  prisoners_dilemma:
    name: "Prisoner's dilemma"
    matrix: |
      $$
      \begin{array}{c|cc}
        & C & D \\ \hline
        C & (-1,-1) & (-4,0) \\
        D & (0,-4)  & (-3,-3)
      \end{array}
      $$

  matching_pennies:
    name: "Matching pennies"
    matrix: |
      $$
      \begin{array}{c|cc}
        & H & T \\ \hline
        H & (1,-1)  & (-1,1) \\
        T & (-1,1)  & (1,-1)
      \end{array}
      $$

  household_chores:
    name: "Sharing household chores"
    matrix: |
      $$
      \begin{array}{c|cc}
        & \text{Shop} & \text{Trash} \\ \hline
        \text{Cook}  & (2,0) & (0,1) \\
        \text{Clean} & (0,2) & (1,0)
      \end{array}
      $$

  bach_or_stravinski:
    name: "Bach or Stravinski"
    matrix: |
      $$
      \begin{array}{c|cc}
        & B & S \\ \hline
        B & (2,1) & (0,0) \\
        S & (0,0) & (1,2)
      \end{array}
      $$

  coordination:
    name: "Coordination game"
    matrix: |
      $$
      \begin{array}{c|cc}
        & a & b \\ \hline
        a & (2,2) & (0,0) \\
        b & (0,0) & (1,1)
      \end{array}
      $$

  dominance_elimination:
    name: "Iterated-dominance example"
    matrix: |
      $$
      \begin{array}{c|ccc}
        & c & d & e \\ \hline
        a & (1,0) & (1,2) & (0,1) \\
        b & (0,3) & (0,1) & (2,0)
      \end{array}
      $$

  contingent_plans:
    name: "Strategic form of the dynamic game"
    matrix: |
      $$
      \begin{array}{c|cccc}
        & ce & cf & de & df \\ \hline
        ag & (0,4) & (0,4) & (2,1) & (2,1) \\
        ah & (0,4) & (0,4) & (2,1) & (2,1) \\
        bg & (1,2) & (3,8) & (1,2) & (3,8) \\
        bh & (1,2) & (8,0) & (1,2) & (8,0)
      \end{array}
      $$
