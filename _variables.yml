# Keep all reusable games in this one file.
# Write payoff-table cells as x, y without surrounding parentheses.
# Insert a matrix with, for example:
# {{< var games.prisoners_dilemma.matrix >}}
# Extensive-form entries share rules and register their canonical diagram paths.

games:
  cournot_duopoly:
    name: "Cournot duopoly with seven quantity choices"
    matrix: |
      $$
      \begin{array}{c|rrrrrrr}
        & 0 & 1 & 2 & 3 & 4 & 5 & 6 \\ \hline
        0 & 0, 0 & 0, 11 & 0, 20 & 0, 27 & 0, 32 & 0, 35 & 0, 36 \\
        1 & 11, 0 & 10, 10 & 9, 18 & 8, 24 & 7, 28 & 6, 30 & 5, 30 \\
        2 & 20, 0 & 18, 9 & 16, 16 & 14, 21 & 12, 24 & 10, 25 & 8, 24 \\
        3 & 27, 0 & 24, 8 & 21, 14 & 18, 18 & 15, 20 & 12, 20 & 9, 18 \\
        4 & 32, 0 & 28, 7 & 24, 12 & 20, 15 & 16, 16 & 12, 15 & 8, 12 \\
        5 & 35, 0 & 30, 6 & 25, 10 & 20, 12 & 15, 12 & 10, 10 & 5, 6 \\
        6 & 36, 0 & 30, 5 & 24, 8 & 18, 9 & 12, 8 & 6, 5 & 0, 0
      \end{array}
      $$

  inspection:
    name: "Inspection game"
    matrix: |
      $$
      \begin{array}{c|cc}
        & \text{Cheat} & \text{Honest} \\ \hline
        \text{Audit} & -6, -9 & -1, 0 \\
        \text{No audit} & -10, 1 & 0, 0
      \end{array}
      $$

  stackelberg_commitment:
    name: "The value of commitment"
    matrix: |
      $$
      \begin{array}{c|cc}
        & c & d \\ \hline
        a & 2, 1 & 4, 0 \\
        b & 1, 0 & 3, 1
      \end{array}
      $$

  hide_the_treasure:
    name: "Hide the Treasure"
    matrix: |
      $$
      \begin{array}{c|rr}
        & s_1 & s_2 \\ \hline
        h_1 & -1 & 1 \\
        h_2 & 2 & -2
      \end{array}
      $$

  morra:
    name: "Morra"
    matrix: |
      $$
      \begin{array}{c|rrrrrrrrr}
        & 1\text{-}1 & 1\text{-}2 & 1\text{-}3 & 2\text{-}1 & 2\text{-}2 & 2\text{-}3 & 3\text{-}1 & 3\text{-}2 & 3\text{-}3 \\ \hline
        1\text{-}1 & 0 & 2 & 2 & -3 & 0 & 0 & -4 & 0 & 0 \\
        1\text{-}2 & -2 & 0 & 0 & 0 & 3 & 3 & -4 & 0 & 0 \\
        1\text{-}3 & -2 & 0 & 0 & -3 & 0 & 0 & 0 & 4 & 4 \\
        2\text{-}1 & 3 & 0 & 3 & 0 & -4 & 0 & 0 & -5 & 0 \\
        2\text{-}2 & 0 & -3 & 0 & 4 & 0 & 4 & 0 & -5 & 0 \\
        2\text{-}3 & 0 & -3 & 0 & 0 & -4 & 0 & 5 & 0 & 5 \\
        3\text{-}1 & 4 & 4 & 0 & 0 & 0 & -5 & 0 & 0 & -6 \\
        3\text{-}2 & 0 & 0 & -4 & 5 & 5 & 0 & 0 & 0 & -6 \\
        3\text{-}3 & 0 & 0 & -4 & 0 & 0 & -5 & 6 & 6 & 0
      \end{array}
      $$

  pure_saddle_point:
    name: "A pure saddle point"
    matrix: |
      $$
      \begin{array}{c|ccc}
        & d & e & f \\ \hline
        a & 1 & 2 & 3 \\
        b & 4 & 5 & 6 \\
        c & 7 & 8 & 9
      \end{array}
      $$

  two_route_congestion:
    name: "Two drivers choosing between two routes"
    matrix: |
      $$
      \begin{array}{c|cc}
        & e_1 & e_2 \\ \hline
        e_1 & -3, -3 & -1, -2 \\
        e_2 & -2, -1 & -2, -2
      \end{array}
      $$

  instigation:
    name: "Instigation game"
    matrix: |
      $$
      \begin{array}{c|cc}
        & s & \neg s \\ \hline
        a & d, -t & -v, m \\
        \neg a & 0, r & 0, 0
      \end{array}
      $$

  prisoners_dilemma:
    name: "Prisoner's dilemma"
    matrix: |
      $$
      \begin{array}{c|cc}
        & C & D \\ \hline
        C & -1, -1 & -4, 0 \\
        D & 0, -4  & -3, -3
      \end{array}
      $$
    potential: |
      $$
      \begin{array}{c|cc}
        P & C & D \\ \hline
        C & 0 & 1 \\
        D & 1 & 2
      \end{array}
      $$

  modified_matching_pennies:
    name: "Matching pennies with an asymmetric stake"
    matrix: |
      $$
      \begin{array}{c|cc}
        & H & T \\ \hline
        H & 1000 & -1 \\
        T & -1 & 1
      \end{array}
      $$

  zero_sum_best_response_cycle:
    name: "A zero-sum game with a strict pure equilibrium and a best-response cycle"
    matrix: |
      $$
      \begin{array}{c|ccc}
        & H & T & E \\ \hline
        H & 2 & -2 & -1 \\
        T & -2 & 2 & -1 \\
        E & 1 & 1 & 0
      \end{array}
      $$

  shapley_fictitious_play:
    name: "Shapley's fictitious-play counterexample"
    matrix: |
      $$
      \begin{array}{c|ccc}
        & d & e & f \\ \hline
        a & 0, 0 & 1, 0 & 0, 1 \\
        b & 0, 1 & 0, 0 & 1, 0 \\
        c & 1, 0 & 0, 1 & 0, 0
      \end{array}
      $$

  matching_pennies:
    name: "Matching pennies"
    extensive_rules: |
      Player 1 chooses $H$ or $T$. Player 2 then chooses $H$ or $T$
      *without observing player 1's choice*. Player 1 receives $1$ when
      the choices match and $-1$ otherwise; player 2 receives the opposite
      payoff. The two decision nodes of player 2 form one information set.
    extensive_diagram: "../games/extensive-form/matching-pennies.svg"
    matrix: |
      $$
      \begin{array}{c|cc}
        & H & T \\ \hline
        H & 1, -1  & -1, 1 \\
        T & -1, 1  & 1, -1
      \end{array}
      $$

  household_chores:
    name: "Sharing household chores"
    matrix: |
      $$
      \begin{array}{c|cc}
        & \text{Shop} & \text{Trash} \\ \hline
        \text{Cook}  & 2, 0 & 0, 1 \\
        \text{Clean} & 0, 2 & 1, 0
      \end{array}
      $$

  bach_or_stravinski:
    name: "Bach or Stravinski"
    matrix: |
      $$
      \begin{array}{c|cc}
        & B & S \\ \hline
        B & 2, 1 & 0, 0 \\
        S & 0, 0 & 1, 2
      \end{array}
      $$
    potential: |
      $$
      \begin{array}{c|cc}
        P & B & S \\ \hline
        B & 2 & 1 \\
        S & 0 & 2
      \end{array}
      $$

  coordination:
    name: "Coordination game"
    matrix: |
      $$
      \begin{array}{c|cc}
        & a & b \\ \hline
        a & 2, 2 & 0, 0 \\
        b & 0, 0 & 1, 1
      \end{array}
      $$

  dominance_elimination:
    name: "Iterated-dominance example"
    matrix: |
      $$
      \begin{array}{c|ccc}
        & c & d & e \\ \hline
        a & 1, 0 & 1, 2 & 0, 1 \\
        b & 0, 3 & 0, 1 & 2, 0
      \end{array}
      $$

  contingent_plans:
    name: "Strategic form of the dynamic game"
    matrix: |
      $$
      \begin{array}{c|cccc}
        & ce & cf & de & df \\ \hline
        ag & 0, 4 & 0, 4 & 2, 1 & 2, 1 \\
        ah & 0, 4 & 0, 4 & 2, 1 & 2, 1 \\
        bg & 1, 2 & 3, 8 & 1, 2 & 3, 8 \\
        bh & 1, 2 & 8, 0 & 1, 2 & 8, 0
      \end{array}
      $$

  expected_utility:
    name: "Expected utility and partial support"
    matrix: |
      $$
      \begin{array}{c|ccc}
        & x & y & z \\ \hline
        a & 1, 7 & 1, 5 & 3, 4 \\
        b & 2, 3 & 0, 4 & 0, 6
      \end{array}
      $$

  indifference_not_sufficient:
    name: "Indifference is not sufficient"
    matrix: |
      $$
      \begin{array}{c|cc}
        & l & r \\ \hline
        a & 1, 0 & 0, 1 \\
        b & 0, 1 & 1, 0 \\
        c & 0.6, 0 & 0.6, 0
      \end{array}
      $$

  penalty_kicks:
    name: "Penalty kicks: scoring probabilities"
    matrix: |
      $$
      \begin{array}{c|cc}
        & u & n \\ \hline
        u & 0.58 & 0.95 \\
        n & 0.93 & 0.70
      \end{array}
      $$

  professors_dilemma:
    name: "Professor's dilemma"
    matrix: |
      $$
      \begin{array}{c|cc}
        & \text{Listen} & \text{Sleep} \\ \hline
        \text{Prepare} & 10^6, 10^6 & -10, 0 \\
        \text{Slack off} & 0, -10 & 0, 0
      \end{array}
      $$

  good_samaritan:
    name: "Good Samaritan: two bystanders"
    matrix: |
      $$
      \begin{array}{c|cc}
        & a & \bar a \\ \hline
        a & 9, 9 & 9, 10 \\
        \bar a & 10, 9 & 0, 0
      \end{array}
      $$

  two_coin_bargaining:
    name: "Dividing two coins"
    rules: |
      Player 1 proposes how to divide two coins, choosing an amount
      $k\in\{0,1,2\}$ to keep. Player 2 either
      accepts ($a$) or rejects ($r$). Acceptance gives payoffs $(k,2-k)$;
      rejection gives $(0,0)$.
    diagram: "../games/extensive-form/two-coin-bargaining.svg"

  chance_moves:
    name: "A game with chance moves"
    rules: |
      Player 1 first chooses $a$ or $b$. After $a$, player 2 chooses
      $c$ or $d$, giving payoffs $(1,3)$ or $(4,1)$, respectively.
      After $b$, chance ends the game with payoffs $(2,2)$ with probability $1/2$
      and otherwise gives player 1 another decision. Player 1 then
      chooses $e$ or $f$. Action $f$ gives $(3,3)$; action $e$ leads
      to a second chance move, with payoffs $(0,4)$, $(4,2)$, and $(8,0)$ having
      probabilities $1/4,1/2,1/4$, respectively. All earlier actions
      and chance outcomes are observed whenever a player acts, so
      this game has perfect information. Payoff pairs are ordered
      $(\text{player 1},\text{player 2})$.
    diagram: "../games/extensive-form/chance-moves.svg"

  poker_endgame:
    name: "A basic poker endgame"
    rules: |
      Both players ante one chip. Chance gives player 1 a winning card
      $W$ with probability $1/4$ or a losing card $L$ with probability
      $3/4$. Only player 1 sees the card; player 2 receives no card.
      Player 1 may check, ending in a showdown, or bet two more chips.
      After a bet, player 2 may fold or call by adding two chips.
      Payoffs are *net gains*, including the ante: checking gives
      player 1 gain $+1$ with $W$ and $-1$ with $L$; a fold gives player 1 gain
      $+1$; a call gives player 1 gain $+3$ with $W$ and $-3$ with $L$.
      Player 2 receives the opposite payoff [@ferguson2000, Section 5.2].
    diagram: "../games/extensive-form/poker-endgame.svg"

  kuhn_poker:
    name: "Kuhn poker"
    rules: |
      Two players each ante one chip. A deck contains three cards, the ranking from lowest to highest is
      $J<Q<K$. Each player receives one private card, uniformly without
      replacement; the remaining card is unused. Player 1 may check or
      bet one chip. After a check, player 2 may check or bet one chip.
      A player facing a bet may fold or call by adding one chip; there
      are no raises. Two checks or a call lead to a showdown, won by
      the higher card. A fold awards the pot to the other player.
      The winner's net gain is one chip after two checks or a fold,
      and two chips after a called bet. The loser loses the same amount.
    deal_diagram: "../games/extensive-form/kuhn-poker-deal.svg"
    betting_diagram: "../games/extensive-form/kuhn-poker-betting.svg"
    information_diagram: "../games/extensive-form/kuhn-poker-information.svg"

  forgotten_visit:
    name: "Forgetting an earlier decision"
    rules: |
      One player chooses $A$ or $B$. Choosing $B$ immediately ends the
      game with payoff $0$. Choosing $A$ leads to another decision:
      $A$ now gives payoff $1$, while $B$ gives payoff $4$.
      The two decision nodes belong to the *same information set*:
      the player cannot tell whether this is the first or second visit.
    diagram: "../games/extensive-form/forgotten-visit.svg"
