# Keep all reusable normal-form games in this one file.
# Write payoff-table cells as x, y without surrounding parentheses.
# Insert a matrix with, for example:
# {{< var games.prisoners_dilemma.matrix >}}

games:
  two_route_congestion:
    name: "Two drivers choosing between two routes"
    matrix: |
      $$
      \begin{array}{c|cc}
        & e_1 & e_2 \\ \hline
        e_1 & -3, -3 & -1, -2 \\
        e_2 & -2, -1 & -2, -2
      \end{array}
      $$

  instigation:
    name: "Instigation game"
    matrix: |
      $$
      \begin{array}{c|cc}
        & s & \neg s \\ \hline
        a & d, -t & -v, m \\
        \neg a & 0, r & 0, 0
      \end{array}
      $$

  prisoners_dilemma:
    name: "Prisoner's dilemma"
    matrix: |
      $$
      \begin{array}{c|cc}
        & C & D \\ \hline
        C & -1, -1 & -4, 0 \\
        D & 0, -4  & -3, -3
      \end{array}
      $$

  matching_pennies:
    name: "Matching pennies"
    matrix: |
      $$
      \begin{array}{c|cc}
        & H & T \\ \hline
        H & 1, -1  & -1, 1 \\
        T & -1, 1  & 1, -1
      \end{array}
      $$

  household_chores:
    name: "Sharing household chores"
    matrix: |
      $$
      \begin{array}{c|cc}
        & \text{Shop} & \text{Trash} \\ \hline
        \text{Cook}  & 2, 0 & 0, 1 \\
        \text{Clean} & 0, 2 & 1, 0
      \end{array}
      $$

  bach_or_stravinski:
    name: "Bach or Stravinski"
    matrix: |
      $$
      \begin{array}{c|cc}
        & B & S \\ \hline
        B & 2, 1 & 0, 0 \\
        S & 0, 0 & 1, 2
      \end{array}
      $$

  coordination:
    name: "Coordination game"
    matrix: |
      $$
      \begin{array}{c|cc}
        & a & b \\ \hline
        a & 2, 2 & 0, 0 \\
        b & 0, 0 & 1, 1
      \end{array}
      $$

  dominance_elimination:
    name: "Iterated-dominance example"
    matrix: |
      $$
      \begin{array}{c|ccc}
        & c & d & e \\ \hline
        a & 1, 0 & 1, 2 & 0, 1 \\
        b & 0, 3 & 0, 1 & 2, 0
      \end{array}
      $$

  contingent_plans:
    name: "Strategic form of the dynamic game"
    matrix: |
      $$
      \begin{array}{c|cccc}
        & ce & cf & de & df \\ \hline
        ag & 0, 4 & 0, 4 & 2, 1 & 2, 1 \\
        ah & 0, 4 & 0, 4 & 2, 1 & 2, 1 \\
        bg & 1, 2 & 3, 8 & 1, 2 & 3, 8 \\
        bh & 1, 2 & 8, 0 & 1, 2 & 8, 0
      \end{array}
      $$

  expected_utility:
    name: "Expected utility and partial support"
    matrix: |
      $$
      \begin{array}{c|ccc}
        & x & y & z \\ \hline
        a & 1, 7 & 1, 5 & 3, 4 \\
        b & 2, 3 & 0, 4 & 0, 6
      \end{array}
      $$

  indifference_not_sufficient:
    name: "Indifference is not sufficient"
    matrix: |
      $$
      \begin{array}{c|cc}
        & l & r \\ \hline
        a & 1, 0 & 0, 1 \\
        b & 0, 1 & 1, 0 \\
        c & 0.6, 0 & 0.6, 0
      \end{array}
      $$

  penalty_kicks:
    name: "Penalty kicks: scoring probabilities"
    matrix: |
      $$
      \begin{array}{c|cc}
        & u & n \\ \hline
        u & 0.58 & 0.95 \\
        n & 0.93 & 0.70
      \end{array}
      $$

  professors_dilemma:
    name: "Professor's dilemma"
    matrix: |
      $$
      \begin{array}{c|cc}
        & \text{Listen} & \text{Sleep} \\ \hline
        \text{Prepare} & 10^6, 10^6 & -10, 0 \\
        \text{Slack off} & 0, -10 & 0, 0
      \end{array}
      $$

  good_samaritan:
    name: "Good Samaritan: two bystanders"
    matrix: |
      $$
      \begin{array}{c|cc}
        & a & \bar a \\ \hline
        a & 9, 9 & 9, 10 \\
        \bar a & 10, 9 & 0, 0
      \end{array}
      $$
