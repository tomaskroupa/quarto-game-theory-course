# Quarto 1.9+ renders books through the bundled Typst orange-book format.
project:
  output-dir: _site/downloads

book:
  subtitle: "Textbook"
  chapters:
    - index.print.qmd
    - lectures/01-strategic-games.qmd

format:
  typst:
    template-partials:
      - styles/typst-show.typ
toc: true
number-sections: true
filters:
  - path: filters/print-empty-title.lua
    at: post-quarto
