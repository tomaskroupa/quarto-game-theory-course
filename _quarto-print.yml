# Quarto 1.9+ renders books through the bundled Typst orange-book format.
project:
  output-dir: _site/downloads

book:
  subtitle: "Textbook"
  chapters:
    - index.print.qmd
    - lectures/01-strategic-games.qmd
    - lectures/02-mixed-strategy-nash-equilibrium.qmd
    - part: classroom-games/index.qmd
      chapters:
        - classroom-games/two-thirds-of-average.qmd

format:
  typst:
    template-partials:
      - styles/typst-show.typ
toc: true
number-sections: true
filters:
  - path: filters/print-empty-title.lua
    at: post-quarto
  - path: filters/print-payoff-spacing.lua
    at: post-quarto
