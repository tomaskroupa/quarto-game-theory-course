<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">Kuhn poker: betting after one deal</title>
<desc id="desc">A complete betting continuation for one fixed deal; links to nodes following other deals are not shown.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526174"/></marker></defs>
<rect width="900" height="520" fill="white"/>
<g font-family="Arial, sans-serif" font-size="22" fill="#192a3c">
<circle cx="450" cy="58" r="24" fill="#eaf2fc" stroke="#245a91" stroke-width="2.5"/>
<text x="450" y="66" text-anchor="middle" font-size="23" font-weight="bold" fill="#245a91">1</text>
<path d="M 428.92 71.43 L 258.61 179.95" stroke="#526174" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="296.6" y="102.0" width="70.7" height="27" rx="3" fill="white"/>
<text x="332" y="123" text-anchor="middle" font-size="21" font-weight="normal" fill="#192a3c">check</text>
<path d="M 471.71 70.39 L 665.68 181.12" stroke="#526174" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="539.6" y="102.0" width="70.7" height="27" rx="3" fill="white"/>
<text x="575" y="123" text-anchor="middle" font-size="21" font-weight="normal" fill="#192a3c">bet 1</text>
<circle cx="235" cy="195" r="24" fill="#fff1df" stroke="#9a4f15" stroke-width="2.5"/>
<text x="235" y="203" text-anchor="middle" font-size="23" font-weight="bold" fill="#9a4f15">2</text>
<circle cx="690" cy="195" r="24" fill="#fff1df" stroke="#9a4f15" stroke-width="2.5"/>
<text x="690" y="203" text-anchor="middle" font-size="23" font-weight="bold" fill="#9a4f15">2</text>
<path d="M 217.32 212.68 L 109.19 320.81" stroke="#526174" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="127.7" y="241.0" width="70.7" height="27" rx="3" fill="white"/>
<text x="163" y="262" text-anchor="middle" font-size="21" font-weight="normal" fill="#192a3c">check</text>
<circle cx="100" cy="330" r="3.5" fill="#526174"/>
<text x="100" y="361" text-anchor="middle" font-size="23" font-weight="bold" fill="#192a3c">(w, −w)</text>
<path d="M 251.99 213.34 L 340.98 309.45" stroke="#526174" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="269.6" y="241.0" width="70.7" height="27" rx="3" fill="white"/>
<text x="305" y="262" text-anchor="middle" font-size="21" font-weight="normal" fill="#192a3c">bet 1</text>
<circle cx="360" cy="330" r="24" fill="#eaf2fc" stroke="#245a91" stroke-width="2.5"/>
<text x="360" y="338" text-anchor="middle" font-size="23" font-weight="bold" fill="#245a91">1</text>
<path d="M 675.61 215.45 L 602.48 319.37" stroke="#526174" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="612.8" y="241.0" width="59.4" height="27" rx="3" fill="white"/>
<text x="642.5" y="262" text-anchor="middle" font-size="21" font-weight="normal" fill="#192a3c">fold</text>
<circle cx="595" cy="330" r="3.5" fill="#526174"/>
<text x="595" y="361" text-anchor="middle" font-size="23" font-weight="bold" fill="#192a3c">(1, −1)</text>
<path d="M 706.21 214.03 L 796.57 320.10" stroke="#526174" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="717.8" y="241.0" width="59.4" height="27" rx="3" fill="white"/>
<text x="747.5" y="262" text-anchor="middle" font-size="21" font-weight="normal" fill="#192a3c">call</text>
<circle cx="805" cy="330" r="3.5" fill="#526174"/>
<text x="805" y="361" text-anchor="middle" font-size="23" font-weight="bold" fill="#192a3c">(2w, −2w)</text>
<path d="M 344.84 349.88 L 277.88 437.66" stroke="#526174" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="285.3" y="367.0" width="59.4" height="27" rx="3" fill="white"/>
<text x="315.0" y="388" text-anchor="middle" font-size="21" font-weight="normal" fill="#192a3c">fold</text>
<circle cx="270" cy="448" r="3.5" fill="#526174"/>
<text x="270" y="479" text-anchor="middle" font-size="23" font-weight="bold" fill="#192a3c">(−1, 1)</text>
<path d="M 375.68 349.47 L 446.85 437.87" stroke="#526174" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="377.8" y="367.0" width="59.4" height="27" rx="3" fill="white"/>
<text x="407.5" y="388" text-anchor="middle" font-size="21" font-weight="normal" fill="#192a3c">call</text>
<circle cx="455" cy="448" r="3.5" fill="#526174"/>
<text x="455" y="479" text-anchor="middle" font-size="23" font-weight="bold" fill="#192a3c">(2w, −2w)</text>
<text x="665" y="426" text-anchor="middle" font-size="21" font-weight="normal" fill="#536276">w = +1 if x &gt; y</text>
<text x="665" y="457" text-anchor="middle" font-size="21" font-weight="normal" fill="#536276">w = −1 if x &lt; y</text>
<text x="450" y="509" text-anchor="middle" font-size="19" font-weight="normal" fill="#536276">Fixed deal (x, y); all payoffs are net gains.</text>
</g>
