<svg xmlns="http://www.w3.org/2000/svg" width="940" height="475" viewBox="0 0 940 475" role="img" aria-labelledby="title desc">
<title id="title">A basic poker endgame</title>
<desc id="desc">Chance determines player 1 card. Player 2 cannot observe the card when responding to a bet.</desc>
