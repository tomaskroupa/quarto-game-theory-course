<text x="307.5" y="345" text-anchor="middle" font-size="21" font-weight="normal" fill="#192a3c">fold</text>
<circle cx="275" cy="405" r="3.5" fill="#526174"/>
<text x="275" y="436" text-anchor="middle" font-size="23" font-weight="bold" fill="#192a3c">(1, −1)</text>
