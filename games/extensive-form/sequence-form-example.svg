<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="475" viewBox="0 0 1040 475" role="img" aria-labelledby="title desc">
<title id="title">A sequence-form example</title>
<desc id="desc">Player 1 chooses A or B. Player 2 observes this choice and chooses g or h after A, or i or j after B. Player 1 chooses C or D after A and E or F after B, without seeing player 2’s move. The terminal labels give player 1’s payoff; player 2 receives its negative.</desc>
