<title id="title">A game with chance moves</title>
<desc id="desc">Players 1 and 2 choose actions a to f. Chance nodes labelled c select outcomes with the displayed probabilities. Terminal payoff pairs are ordered player 1, player 2. After a, c gives (1, 3) and d gives (4, 1). After b, chance gives (2, 2) or a further decision. Action f gives (3, 3); e leads to payoffs (0, 4), (4, 2), (8, 0).</desc>
