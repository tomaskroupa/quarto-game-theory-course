project:
  resources:
    - exercises/*.pdf

book:
  chapters:
    - index.qmd

    - part: "Course Info"
      chapters:
        - course-info/index.qmd
        - course-info/schedule.qmd
        - course-info/exercises.qmd
        - course-info/topics.qmd
        - course-info/assessment.qmd
        - course-info/semestral-project.qmd
        - course-info/semestral-projects.qmd

    - part: "Textbook"
      chapters:
        - lectures/01-strategic-games.qmd
        - lectures/02-mixed-strategy-nash-equilibrium.qmd

    - part: classroom-games/index.qmd
      chapters:
        - classroom-games/two-thirds-of-average.qmd
        - classroom-games/instigation-game.qmd

format:
  html:
    theme:
      - cosmo
      - styles/book.scss
    toc: true
    number-sections: true
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    html-math-method: mathjax
